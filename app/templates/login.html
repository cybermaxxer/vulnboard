<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnBoard</title>
</head>
<body>
    {% if session.get('username') %}
        <p>Welcome, {{ session['username'] }}! <a href="/logout">Logout</a></p>
    {% else %}
        <p>you're not logged in. i used jinja to be able to display this message, based on the session data.</p>
    {% endif %}
    <h1>Welcome to VulnBoard login page</h1>
    
    <form method="POST" action="/login">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <button type="submit">Login</button>
    </form>
</body>
</html>
