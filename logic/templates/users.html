<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnBoard</title>
</head>
<body> 
    <h1>VulnBoard - Users</h1>
    <h2>List of Users</h2>
    <ul>
        {% for user in users %}
            <li>user_id: {{ user.id }}, username: {{ user.username }}, password: {{ user.password }}, is_admin: {{ user.is_admin }}</li>
        {% endfor %}
    </ul>
</body>
</html>
